name: CI

on:
    push:
        branches: [develop, main]
    pull_request:
        branches: [develop, main]

jobs:
    backend-check:
        runs-on: macos-14 # Apple Silicon 러너 (M3와 동일 아키텍처)
        defaults:
            run:
                working-directory: backend
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Install dependencies
              run: pip install -r requirements.txt

            - name: Lint (ruff)
              run: ruff check .

            - name: Run tests
              run: pytest